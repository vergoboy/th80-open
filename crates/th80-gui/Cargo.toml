[package]
name = "th80-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native offline desktop profile editor for EPOMAKER TH80 Pro"

[[bin]]
name = "th80-gui"
path = "src/main.rs"

[dependencies]
th80-core = { path = "../th80-core" }
th80-probe = { path = "../th80-probe" }
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
pollster = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
