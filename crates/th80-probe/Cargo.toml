[package]
name = "th80-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Passive USB/HID diagnostics for EPOMAKER TH80 Pro and ROYUAN receiver"

[[bin]]
name = "th80-probe"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
th80-core = { path = "../th80-core" }
